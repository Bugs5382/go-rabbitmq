name: Autolabel
# Applies a categorizing label to each PR from its conventional-commit title,
# using the `autolabeler` rules in release-drafter.yml. Release Drafter v7 ships
# the autolabeler as its own action, so this run only labels and never drafts a
# release. job-label-checker then passes automatically (it re-runs on the
# `labeled` event). `edited` is kept so a retitled PR gets relabeled.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  autolabel:
    name: Autolabel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels from PR title
        uses: release-drafter/release-drafter/autolabeler@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
